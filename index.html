<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>Kalshi Edge</title><style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#16181d;--muted:#5f6670;--line:#e3e4e1;--accent:#0f7b4f;
--warn-bg:#fff6e0;--warn:#7a5200;--bad:#b42318;--good:#0f7b4f;--chip:#eef0ec}
@media (prefers-color-scheme:dark){:root{--bg:#111315;--card:#1a1d20;--ink:#e8e9e6;--muted:#9aa1a9;
--line:#2a2e33;--accent:#4cc38a;--warn-bg:#2b2410;--warn:#f0c062;--bad:#ff7a70;--good:#4cc38a;
--chip:#23272b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:28px 0 10px}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;
margin:16px 0;font-size:14px}
.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.big{font-size:20px;font-weight:650}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.legs{margin:10px 0 0;padding:0;list-style:none}
.legs li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;
gap:12px}.legs li span:last-child{color:var(--muted);white-space:nowrap;font-size:13px}
.take{margin-top:10px;font-size:14px}.take b{color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}td.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}.pos{color:var(--good)}.neg{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:20px;font-weight:650}
details{margin-top:8px}summary{cursor:pointer;color:var(--muted)}
#lock{max-width:360px;margin:20vh auto;padding:0 16px;text-align:center}
#lock input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
background:var(--card);color:var(--ink);font-size:16px;margin:12px 0}
#lock button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);
color:#fff;font-size:16px}
</style></head><body>
<div id="lock"><h1>Kalshi Edge</h1><div class="sub">Enter the password</div>
<form id="f"><input id="pw" type="password" autocomplete="current-password" autofocus>
<button>Unlock</button><div id="err" class="sub"></div></form></div>
